<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Expense Tracker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f9;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 15px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">💰</div>

    <h1>Welcome Back!</h1>

    <p class="subtitle">
        Login to manage your expenses
    </p>

    {% if form.errors %}
        <div class="error">
            Invalid username or password. Please try again.
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label for="id_username">Username</label>

        <input type="text"
               name="username"
               id="id_username"
               placeholder="Enter your username"
               required
               autofocus>

        <label for="id_password">Password</label>

        <input type="password"
               name="password"
               id="id_password"
               placeholder="Enter your password"
               required>

        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div class="footer">
        Expense Tracker | Manage your money wisely 💙
    </div>

</div>

</body>
</html>
